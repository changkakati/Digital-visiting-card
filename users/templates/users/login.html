{% extends "base.html" %}

{% block content %}

<form method="POST" class="space-y-4 max-w-sm mx-auto">
  {% csrf_token %}
  
  <div>
    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
    <input 
      type="text" 
      name="username" 
      id="username" 
      class="w-full border mt-1 border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
      required
    >
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
    <input 
      type="password" 
      name="password" 
      id="password" 
      class="w-full border mt-1 border-gray-300 rounded px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
      required
    >
  </div>

  <button 
    type="submit" 
    class="w-full bg-black text-white py-2 rounded hover:bg-slate-700"
  >
    Login
  </button>
</form>

<p class="pt-2 text-center">Don't have an account? <a href="{% url 'users:register_user' %}" class="text-red-500 underline">Register</a></p>

{% endblock content %}
